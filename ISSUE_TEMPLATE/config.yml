YAML
name: Otolith Age QA/QC Check

on:
  issues:
    types: [opened, labeled]

jobs:
  check-agreement:
    if: contains(github.event.issue.labels.*.name, 'qa-qc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Dependencies
        run: Rscript -e "install.packages('stringr')"

      - name: Run Agreement Check
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: Rscript .github/scripts/check_age_agreement.R

      - name: Trigger Re-read & Consensus (If Diff > 1)
        if: steps.check.outputs.disagreement == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Add Re-read label to the issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['re-read-consensus']
            });
            
            // Post automated comment flagging the discrepancy
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **QA/QC Alert:** Age estimates differ by **${process.env.DIFF_VAL} year(s)** (> 1 year threshold). This item requires consensus review.`
            });
        env:
          DIFF_VAL: ${{ steps.check.outputs.diff_val }}
